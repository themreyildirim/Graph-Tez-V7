# Graph-Tez V7 — tek komutla test calistirma
# Kullanim:  .venv_wp13\Scripts\python.exe -m pytest -q
#
# Bu dosya mevcut unittest testlerini DEGISTIRMEZ; yalnizca hepsini tek
# komutta toplanabilir hale getirir. tests/conftest.py scripts/ yolunu
# sys.path'e ekler, boylece testlerin kendi sys.path.insert satirlari
# gereksiz hale gelir ama calismaya devam eder.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
norecursedirs = .deps .venv_wp13 .git __pycache__ legacy data models notebooks reports EMT2_Teslim_v1 EMT2_Akademik_v2
addopts = -p no:cacheprovider --strict-markers --durations=10
markers =
    slow: uzun suren testler (gercek fit/replay iceren WP09/WP10 denetimleri)
filterwarnings =
    ignore::DeprecationWarning
