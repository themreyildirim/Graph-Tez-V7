size="16" font-weight="700" fill="#10303a">EMT2 uygulaması — A1P1 (WP09 + WP10)</text><text x="770" y="62" font-size="11" fill="#5b7682">Kod: wp09_encoder.py, wp10_molecular_encoder.py</text><rect x="758" y="78" width="712" height="760" rx="10" fill="none" stroke="#e3eef1" stroke-width="2"/><rect x="790" y="104" width="420" height="156" rx="8" fill="#ffffff" stroke="#0f6e7d" stroke-width="1.6"/><text x="806" y="126" font-size="12.5" font-weight="700" fill="#0f6e7d">İç ağ 1: protein–protein</text><text x="806" y="142" font-size="10.5" fill="#5b7682">STRING insan-700 · 63 düğüm · 184 kenar</text><rect x="808" y="158" width="110" height="52" rx="7" fill="#e3eef1" stroke="#0f6e7d" stroke-width="1.6"/><text x="863.0" y="178.0" text-anchor="middle" font-size="12" font-weight="600" fill="#10303a">x_p</text><text x="863.0" y="194.0" text-anchor="middle" font-size="11" fill="#5b7682">56 boyut</text><rect x="948" y="158" width="244" height="52" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="1070.0" y="178.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#10303a">z + ReLU(S·z + M·mean)</text><text x="1070.0" y="194.0" text-anchor="middle" font-size="11" fill="#5b7682">gerçek mesaj geçişi</text><path d="M 918 184 L 946 184" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="808" y="236" font-size="10.5" fill="#0f6e7d">kenar silinince ΔL2 = 13,16 · gradyan 0,0040</text><rect x="790" y="288" width="420" height="116" rx="8" fill="#ffffff" stroke="#0f6e7d" stroke-width="1.6"/><text x="806" y="310" font-size="12.5" font-weight="700" fill="#0f6e7d">İç ağ 2: atom–bağ grafı</text><text x="806" y="326" font-size="10.5" fill="#5b7682">44 / 14 boyut · tek katman · 54 QC açık</text><rect x="808" y="338" width="384" height="50" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="1000.0" y="363.0" text-anchor="middle" font-size="11" font-weight="600" fill="#10303a">h₀ + ReLU(S·h₀ + mean ReLU(U·h₀ⱼ + V·e_ji)) → pool → 8</text><rect x="790" y="432" width="420" height="104" rx="8" fill="#ffffff" stroke="#0f6e7d" stroke-width="1.6"/><text x="806" y="454" font-size="12.5" font-weight="700" fill="#0f6e7d">Rol ayrımlı okuma</text><text x="806" y="470" font-size="10.5" fill="#5b7682">target · enzyme · transporter · carrier</text><rect x="808" y="478" width="384" height="44" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="1000.0" y="500.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#10303a">4 × maskeli ortalama = 128 boyut</text><text x="808" y="470" font-size="10" fill="#0f6e7d">girdi: İç ağ 1 protein gömmeleri (tipli toplama)</text><rect x="1248" y="432" width="200" height="104" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="1348.0" y="478.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">Kimya + maske</text><text x="1348.0" y="494.0" text-anchor="middle" font-size="11" fill="#5b7682">ReLU(Lin(5,8)) + 5</text><rect x="900" y="560" width="420" height="56" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="1110.0" y="588.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">Füzyon: 128 + 8 + 5 + 8 + 1 = 150 boyut</text><path d="M 1000 536 L 1060 558" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 1348 536 L 1230 558" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 1210 396 L 1286 558" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="900" y="672" width="420" height="56" rx="7" fill="#e3eef1" stroke="#0f6e7d" stroke-width="1.6"/><text x="1110.0" y="700.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">Linear(150, K) → PT başına bağımsız vektör</text><path d="M 1110 616 L 1110 670" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="900" y="760" font-size="11.5" fill="#5b7682">K ≈ 240 → başlık 36.240 parametre; omurga 5.512.</text><text x="900" y="778" font-size="11.5" fill="#b4553f">Parametrelerin %86,8'i başlıkta → küçük kohortta yüksek varyans.</text><text x="900" y="802" font-size="11.5" fill="#5b7682">Yan etki düğümü yok; sınıf kimliği başlık satırında örtük.</text><text x="900" y="820" font-size="11.5" fill="#0f6e7d">side_effect_edges = False (152/152 iş).</text></svg>