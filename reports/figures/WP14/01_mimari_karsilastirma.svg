<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Segoe UI, Calibri, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6e7d"/></marker></defs><text x="40" y="42" font-size="16" font-weight="700" fill="#10303a">EMT1 tasarımı — Graph-in-Graph (rapor §4.3)</text><text x="40" y="62" font-size="11" fill="#5b7682">Denklem (4.8)–(4.13); iç ağ üzerinde yayılım denklemi tanımlı değil</text><rect x="28" y="78" width="690" height="760" rx="10" fill="none" stroke="#e3eef1" stroke-width="2"/><rect x="60" y="104" width="300" height="140" rx="8" fill="#ffffff" stroke="#0f6e7d" stroke-width="1.6" stroke-dasharray="6 4"/><text x="76" y="126" font-size="12.5" font-weight="700" fill="#0f6e7d">İç ağ: proteinler</text><text x="76" y="142" font-size="10.5" fill="#5b7682">V_P = 70 düğüm</text><rect x="78" y="162" width="120" height="56" rx="7" fill="#e3eef1" stroke="#0f6e7d" stroke-width="1.6"/><text x="138.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">x_p</text><text x="138.0" y="200.0" text-anchor="middle" font-size="11" fill="#5b7682">51 boyut</text><rect x="228" y="162" width="112" height="56" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="284.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">h_p</text><text x="284.0" y="200.0" text-anchor="middle" font-size="11" fill="#5b7682">MLP_P(x_p)</text><path d="M 200 190 L 226 190" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="376" y="150" width="210" height="76" rx="7" fill="#fdf1e7" stroke="#b4553f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="390" y="174" font-size="12" fill="#b4553f">E_PP = 70 kenar</text><text x="390" y="194" font-size="11.5" fill="#b4553f">şemada tanımlı,</text><text x="390" y="212" font-size="11.5" fill="#b4553f">denklemlerde YOK</text><rect x="60" y="268" width="140" height="56" rx="7" fill="#e3eef1" stroke="#0f6e7d" stroke-width="1.6"/><text x="130.0" y="290.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">x_d</text><text x="130.0" y="306.0" text-anchor="middle" font-size="11" fill="#5b7682">25 boyut</text><rect x="60" y="348" width="140" height="56" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="130.0" y="370.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">h_d⁽⁰⁾</text><text x="130.0" y="386.0" text-anchor="middle" font-size="11" fill="#5b7682">MLP_D</text><path d="M 130 324 L 130 346" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="230" y="348" width="150" height="56" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="305.0" y="370.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">μ_d</text><text x="305.0" y="386.0" text-anchor="middle" font-size="11" fill="#5b7682">mean h_p, N(d)</text><path d="M 284 220 L 284 346" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="284.0" y="277.0" text-anchor="middle" font-size="10.5" fill="#5b7682">tipsiz ortalama</text><rect x="130" y="436" width="250" height="60" rx="7" fill="#f7fafb" stroke="#0f6e7d" stroke-width="1.6"/><text x="255.0" y="460.0" text-anchor="middle" font-size="13" font-weight="600" fill="#10303a">h_d = ReLU(W_agg·[·∥·])</text><text x="255.0" y="476.0" text-anchor="middle" font-size="11" fill="#5b7682">eşitlik (4.11)</text><path d="M 130 404 L 200 434" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 300 404 L 290 434" stroke="#0f6e7d" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="430" y="262" width="210" height="118" rx="8" fill="#ffffff" stroke="#0f6e7d" stroke-width="1.6" stroke-dasharray="6 4"/><text x="446" y="284" font-size="12.5" font-weight="700" fill="#0f6